publish_to: "none"
version: 0.1.0

environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: ">=3.38.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  convokit:
